  <g id="text_9">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #566b7e" x="11.52" y="78.482437" transform="rotate(-0 11.52 78.482437)">Design only: selection counts are generated, but AP and empirical-gap results are NOT MEASURED.</text>
