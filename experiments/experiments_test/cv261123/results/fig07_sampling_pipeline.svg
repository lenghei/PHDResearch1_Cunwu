   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #142d44" transform="translate(344.367109 409.300213)">Bind real checkpoints -&gt; YOLO on test-dev -&gt; save predictions</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #142d44" transform="translate(367.382891 424.125292)">AP + latency + 95% image bootstrap -&gt; learned rules</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #b55454" x="516.42" y="481.536" transform="rotate(-0 516.42 481.536)">No learning/accuracy claims are made until actual (p,d) evaluations exist.</text>
